name: Build and publish a Docker image to ghcr.io

# Branch flow:
#   feature/fix branch push -> builds + pushes test images tagged <branch>-<kasm rolling tag>
#   pull request to develop  -> build-only check (only for PRs from forks; same-repo
#                               branches are already built by their push)
#   develop push / weekly    -> latest, 1.19.0-rolling, 1.20.0-rolling
#   published release        -> <version> (1.19) and <version>-1.20.0-rolling

on:
  release:
    types: [ published ]

  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop

  schedule:
    - cron: "0 13 * * 1"

  workflow_dispatch:

concurrency:
  # One run per branch/PR; a newer push to a test branch cancels the older build.
  # develop, releases and scheduled builds always run to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.event_name != 'release' && github.event_name != 'schedule' }}

jobs:
  docker_publish:
    # Same-repo PRs are already built by the branch push; only build fork PRs here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      # Build both Kasm variants even if one fails
      fail-fast: false
      matrix:
        include:
          # Kasm 1.19 and older
          - kasm: "1.19"
            base_tag: 1.19.0-rolling-daily
            rolling_tag: 1.19.0-rolling
            also_latest: true
            release_suffix: ""
          # Kasm 1.20 and newer (switch base_tag to the 1.20 rolling tag once Kasm publishes it)
          - kasm: "1.20"
            base_tag: develop
            rolling_tag: 1.20.0-rolling
            also_latest: false
            release_suffix: "-1.20.0-rolling"

    name: docker_publish (Kasm ${{ matrix.kasm }})

    env:
      IS_DEVELOP: ${{ github.ref == 'refs/heads/develop' }}
      # Fork PRs get a read-only token, so they only build
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # develop: latest (1.19 variant only) and the Kasm rolling tag
            type=raw,value=latest,enable=${{ matrix.also_latest && env.IS_DEVELOP == 'true' }}
            type=raw,value=${{ matrix.rolling_tag }},enable=${{ env.IS_DEVELOP == 'true' }}

            # test branches: <branch>-<rolling tag>, e.g. fix-startup-1.20.0-rolling
            type=ref,event=branch,suffix=-${{ matrix.rolling_tag }},enable=${{ env.IS_DEVELOP != 'true' }}

            # fork PRs (build only, never pushed): pr-<n>-<rolling tag>
            type=ref,event=pr,suffix=-${{ matrix.rolling_tag }}

            # release tag (strip leading v); 1.20 variant gets a suffix so it doesn't collide
            type=semver,pattern={{version}},suffix=${{ matrix.release_suffix }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_TAG=${{ matrix.base_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
